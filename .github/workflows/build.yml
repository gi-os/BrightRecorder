name: Build & Release APK

# A push to main cuts a release, which BrightMarket picks up and Obtainium installs. There is no
# review between a mistake here and the phone, which is why check.yml exists for every other
# branch and why this one is deliberately narrow about what it runs on.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/check.yml'
      - 'signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer build and
      # `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # The tape arithmetic is where this app's bugs hide, and they are the inaudible-until-awful
      # kind: a resampling index that drifts a sample per block is silent for a minute and a whine
      # after ten. None of it needs a device, so none of it gets to reach the phone untested.
      - name: Unit test the tape
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/BrightRecorder-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/BrightRecorder-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever changes,
      # Obtainium updates fail with an opaque "Failure: Invalid", and the index pins the signer
      # on first sight — so a drift here would orphan every install. Hence the pin.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.xml is renamed to something
      # like res/BW.xml inside the zip. Ask the package what its icon is instead of grepping
      # filenames — the same lookup Obtainium and the launcher do.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      # The index reads the applicationId out of the APK rather than trusting the submission, and
      # it is the app's permanent identity — a change is not an update, it is a second app
      # installed alongside the first with none of the first one's recordings.
      - name: Verify the package name has not moved
        run: |
          grep -qE "^package: name='com\.gios\.brightrecorder'" badging.txt \
            || { echo '::error::applicationId is not com.gios.brightrecorder'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightRecorder-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightRecorder-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      # Exactly one .apk on the release, which is what the index validator requires. The debug
      # build stays an artifact for that reason.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BrightRecorder v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: out/BrightRecorder-v${{ steps.ver.outputs.version }}.apk
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub schedules are
      # best-effort — observed 70 minutes apart against a 15 minute schedule — so without this a
      # new release can sit uncatalogued for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
