name: Check

# Compiles and tests without publishing anything.
#
# The point of this workflow is that a push to main cuts a release, so main is a bad place to find
# out that something does not compile. Any other branch runs this instead: the same build, minus
# the release, and with disposable signing keys.
#
# It is also the only compiler available to a Cowork session — aapt2 ships x86_64-only for Linux,
# so on an aarch64 sandbox a change cannot be built at all, not even the unit tests, which still
# need resources processed. Without this the only way to find out was to push to main.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # light-common is pulled from GitHub Packages, which has no anonymous read.
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test the tape
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # assembleRelease rather than a bare compile: manifest merge and resource processing are
      # where a missing class or a permission that does not exist actually surface, and a Kotlin
      # compile never reaches either.
      - name: Build APKs
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Test release signer rotation
        shell: bash
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/brightrecorder-rotation-test.XXXXXX")
          trap 'rm -rf -- "$test_dir"' EXIT
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          export KEYSTORE_PASSWORD="$(openssl rand -hex 18)" KEY_PASSWORD="$(openssl rand -hex 18)"
          for alias in original rotated; do
            keytool -genkeypair -storetype JKS -keystore "$test_dir/$alias.jks" -alias "$alias" \
              -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD -keyalg RSA -keysize 2048 \
              -validity 1 -dname "CN=BrightRecorder Disposable $alias"
            keytool -exportcert -keystore "$test_dir/$alias.jks" -alias "$alias" -storepass:env KEYSTORE_PASSWORD \
              | sha256sum | cut -d ' ' -f 1 > "$test_dir/$alias.txt"
          done
          export KEYSTORE_FILE="$test_dir/rotated.jks" KEY_ALIAS=rotated SIGNING_LINEAGE_FILE="$test_dir/signing.lineage"
          "$apksigner" rotate --out "$SIGNING_LINEAGE_FILE" \
            --old-signer --ks "$test_dir/original.jks" --ks-key-alias original \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --set-installed-data true --set-rollback false \
            --new-signer --ks "$KEYSTORE_FILE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD
          bash scripts/sign-release.sh "$unsigned" "$test_dir/rotated.apk" "$test_dir/original.txt" "$test_dir/rotated.txt"

          printf '%064d\n' 0 > "$test_dir/wrong-root.txt"
          if bash scripts/sign-release.sh "$unsigned" "$test_dir/wrong-root.apk" "$test_dir/wrong-root.txt" "$test_dir/rotated.txt" > "$test_dir/rejection.log"; then
            echo '::error::Release signing accepted an unexpected lineage root'
            exit 1
          fi
          grep -Fx '::error::APK lineage must link the pinned original and rotated certificates' "$test_dir/rejection.log"

      # Cheap here and worth catching before main, where the same check gates the release.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > badging.txt
          grep -E "^(package:|application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
